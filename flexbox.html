<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zoom Toolbar</title>

  <meta property="og:title" content="CSS Project">
<meta property="og:description" content="My deployed CSS project">
<meta property="og:image" content="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/logo_gmail_lockup_default_2x_r5.png">
<meta property="og:type" content="website">

</head>
<body>


    <div class="zoom-toolbar">

        <div class="tool">
            <i class="bi bi-mic-mute-fill"></i>
            <p>Unmute</p>
        </div>

        <div class="tool">
            <i class="bi bi-camera-video-fill"></i>
            <p>StartVideo</p>
        </div>

        <div class="tool">
            <i class="bi bi-shield-fill"></i>
            <p>Security</p>
        </div>

        <div class="tool">
            <i class="bi bi-people-fill"></i>
            <p>10</p>
            <p>Participants</p>
        </div>

        <div class="tool">
            <i class="bi bi-chat-fill"></i>
            <p>Chat</p>
        </div>


        <div class="tool share">
            <i class="bi bi-arrow-up-square-fill"></i>
            <p>NewShare</p>
        </div>

        <div class="tool">
            <i class="bi bi-pause-fill"></i>
            <p>PauseShare</p>
        </div>

       

        <div class="tool">
            <i class="bi bi-three-dots"></i>
            <p>More</p>
        </div>

    </div>

    <div class="share-status">
        <span>You are Screen Sharing</span>
        <button>Stop Share</button>
    </div>

</div>

</body>
</html>
